name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    env:
      CI: 'true'    # compiler warnings are treated as errors (see RecoverAside.vcxproj)
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          else { $v = "0.0.0-ci.${{ github.run_number }}" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build and package
        shell: pwsh
        run: ./build.ps1 -Platform ${{ matrix.platform }} -Configuration Release -Package -Version ${{ steps.version.outputs.value }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: RecoverAside-${{ steps.version.outputs.value }}-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --repo "${{ github.repository }}" --title "RecoverAside ${{ github.ref_name }}" --generate-notes
