name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    env:
      CI: 'true'    # compiler warnings are treated as errors (see RecoverAside.vcxproj)
    # Same value from every platform, so whichever finishes last is fine.
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # A pushed v* tag uses its own version; a push to main gets 1.0.<run number> and is released
      # under v1.0.<run number>; anything else is a CI-only build.
      - name: Work out version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          elseif ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main') { $v = "1.0.${{ github.run_number }}" }
          else { $v = "0.0.0-ci.${{ github.run_number }}" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build and package
        shell: pwsh
        run: ./build.ps1 -Platform ${{ matrix.platform }} -Configuration Release -Package -Version ${{ steps.version.outputs.value }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: RecoverAside-${{ steps.version.outputs.value }}-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Every pushed v* tag, and every push to main whose builds all pass.
    if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # For a push to main, gh creates the tag on the commit that was built.
        run: gh release create "$TAG" dist/*.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "RecoverAside $TAG" --generate-notes --latest
